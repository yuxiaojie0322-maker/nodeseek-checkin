name: NodeSeek 每日签到

on:
  schedule:
    # 每天 UTC 0:00（北京时间 8:00）运行
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 安装系统依赖（Chromium）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装 Python 依赖
        run: |
          pip install undetected-chromedriver selenium requests
      
      - name: 执行签到
        env:
          NS_COOKIE: ${{ secrets.NS_COOKIE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HEADLESS: "true"
        run: |
          python checkin.py